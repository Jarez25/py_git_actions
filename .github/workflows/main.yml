name: Stats

on:
  schedule:
    - cron: '0  0 * * *'

jobs: 
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name : Setup python 
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run Scrict
        run: python stats.py

      - name: commint and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: mensaje desde el accion
